[package]
name = "hexedit"
version = "0.4.0"
description = "Hex editor with data inspector and C-struct templates"
license = "MIT"
repository = "https://github.com/iso8859-1/hexedit"
edition = "2021"

[lib]
name = "hexedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
codepage = "0.1"
toml = "1.1.8"
flate2 = "1.1.10"
ruzstd = "0.9.1"
lz4_flex = "0.14.0"
